name: awesome_scroll_actions
description: >-
  Awesome Scroll Actions dial. An arc of action pills you spin with a
  vertical drag, tuck away with a side pull, and select with a tap.
version: 2.1.0

repository: https://github.com/robinjere/awesome_scroll-actions
issue_tracker: https://github.com/robinjere/awesome_scroll-actions/issues

screenshots:
  - description: The dial at rest, with the centred action expanded into its pill.
    path: screenshots/open.png
  - description: The same dial in the shipped dark palette.
    path: screenshots/dark.png
  - description: showGuideLine draws the circle the pills ride along.
    path: screenshots/guide.png
  - description: The horizontal arc, mirrored onto the bottom edge.
    path: screenshots/horizontal.png

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: AwesomeScrollIcons
      fonts:
        - asset: lib/fonts/AwesomeScrollIcons.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: lib/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: lib/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: lib/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: lib/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: lib/fonts/PlusJakartaSans-800.ttf
          weight: 800
